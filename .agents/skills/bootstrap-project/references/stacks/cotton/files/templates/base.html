{% load static tetra %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}__TITLE__{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/unpoly/unpoly.min.css' %}">
  <script src="{% static 'vendor/unpoly/unpoly.min.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
  <script src="{% static 'vendor/basecoat/all.min.js' %}" defer></script>
  {% tetra_styles %}
  {% tetra_scripts include_alpine=True %}
</head>
<body class="min-h-screen bg-background text-foreground">
  <main up-main class="mx-auto max-w-3xl p-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
